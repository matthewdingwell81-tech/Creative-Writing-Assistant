openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /billing/config:
    get:
      operationId: getBillingConfiguration
      responses:
        "200":
          description: Native billing and offline receipt verification configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfiguration"
        "401":
          description: Sign in required
        "503":
          description: Billing configuration unavailable
  /billing/subscription:
    get:
      operationId: getSubscription
      responses:
        "200":
          description: Server-verified subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionState"
        "401":
          description: Sign in required
        "503":
          description: Verification temporarily unavailable
    post:
      operationId: refreshSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionVerification"
      responses:
        "200":
          description: Purchase verified against RevenueCat, not client receipt claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionState"
        "400":
          description: Invalid request
        "401":
          description: Sign in required
        "403":
          description: Firebase account does not match the session
        "503":
          description: Verification temporarily unavailable
  /billing/webhook:
    post:
      operationId: receiveSubscriptionEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionEvent"
      responses:
        "204":
          description: Authoritative subscription rechecked; duplicate or stale events are safe
        "400":
          description: Invalid event
        "401":
          description: Invalid webhook authorization
        "503":
          description: Retry delivery
  /documents/{documentId}/coach-history:
    parameters:
      - $ref: "#/components/parameters/PlanningDocumentId"
    get:
      operationId: getCoachHistory
      summary: Passively restore owned Coach history without invoking AI
      responses:
        "200":
          description: Saved history or empty history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachHistorySnapshot"
    put:
      operationId: saveCoachHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachHistoryInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachHistorySnapshot"
        "409":
          description: Another device changed this conversation; reload before writing
    delete:
      operationId: deleteCoachHistory
      summary: Start over on all devices, retaining only a version marker
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachHistorySnapshot"
  /documents/{documentId}/planning:
    parameters:
      - $ref: "#/components/parameters/PlanningDocumentId"
    get:
      operationId: listStoryPlanning
      summary: List story planning records owned by the signed-in user
      responses:
        "200":
          $ref: "#/components/responses/PlanningList"
    post:
      operationId: createStoryPlanning
      summary: Create a story planning record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningInput"
      responses:
        "201":
          $ref: "#/components/responses/PlanningRecord"
  /documents/{documentId}/planning/order:
    parameters:
      - $ref: "#/components/parameters/PlanningDocumentId"
    patch:
      operationId: orderStoryPlanning
      summary: Order all planning records of a kind; returns the complete story plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningOrderInput"
      responses:
        "200":
          $ref: "#/components/responses/PlanningList"
  /documents/{documentId}/planning/{id}:
    parameters:
      - $ref: "#/components/parameters/PlanningDocumentId"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateStoryPlanning
      summary: Edit a planning record without changing its kind or document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningUpdate"
      responses:
        "200":
          $ref: "#/components/responses/PlanningRecord"
    delete:
      operationId: deleteStoryPlanning
      summary: Delete a planning record; character deletion also removes relationships and unlinks events
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    PlanningDocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    PlanningRecord:
      description: Saved planning record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlanningRecord"
    PlanningList:
      description: Complete story plan ordered by position then ID
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlanningRecord"
  schemas:
    BillingConfiguration:
      type: object
      required: [androidApiKey, entitlementIdentifier, receiptPublicKey, managementUrl]
      properties:
        androidApiKey: { type: string }
        entitlementIdentifier: { type: string }
        receiptPublicKey: { type: object, additionalProperties: true }
        managementUrl: { type: string }
    SubscriptionVerification:
      type: object
      properties:
        firebaseIdToken: { type: string, maxLength: 8192 }
    SubscriptionEvent:
      type: object
      required: [event]
      properties:
        event:
          type: object
          required: [id, type]
          properties:
            id: { type: string, minLength: 1, maxLength: 256 }
            type: { type: string, minLength: 1, maxLength: 128 }
            app_user_id: { type: string, minLength: 1, maxLength: 256 }
            transferred_from:
              type: array
              maxItems: 50
              items: { type: string, maxLength: 256 }
            transferred_to:
              type: array
              maxItems: 50
              items: { type: string, maxLength: 256 }
    SubscriptionState:
      type: object
      required: [accountId, tier, status, subscriptionId, expiresAt, verifiedAt, receipt, firebaseSync]
      properties:
        accountId: { type: string }
        tier: { type: string, enum: [free, premium] }
        status: { type: string, enum: [none, active, cancelled, expired] }
        subscriptionId: { type: [string, "null"] }
        expiresAt: { type: [integer, "null"] }
        verifiedAt: { type: integer }
        receipt: { type: string }
        firebaseSync: { type: string, enum: [not-linked, synced, unavailable] }
    CoachMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 20000
    CoachHistoryInput:
      type: object
      required: [messages, draft, revision]
      properties:
        messages:
          type: array
          maxItems: 80
          items:
            $ref: "#/components/schemas/CoachMessage"
        draft:
          type: string
          maxLength: 20000
        revision:
          type: integer
          minimum: 0
        importedAt:
          description: Original device timestamp, supplied only for explicitly approved import
          type: number
    CoachHistorySnapshot:
      type: object
      required: [messages, draft, revision, updatedAt]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachMessage"
        draft:
          type: string
        revision:
          type: integer
        updatedAt:
          type: ["number", "null"]
    PlanningKind:
      type: string
      enum: [character, relationship, timeline, worldbuilding, note]
    PlanningFields:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/PlanningKind"
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        role:
          type: string
          maxLength: 200
        motivations:
          type: string
          maxLength: 20000
        traits:
          type: string
          maxLength: 20000
        arc:
          type: string
          maxLength: 20000
        category:
          type: string
          maxLength: 100
        timeLabel:
          type: string
          maxLength: 200
        chapterId:
          type: [integer, "null"]
          minimum: 1
        characterId:
          type: [integer, "null"]
          minimum: 1
        relatedCharacterId:
          type: [integer, "null"]
          minimum: 1
    PlanningInput:
      allOf:
        - $ref: "#/components/schemas/PlanningFields"
      required: [kind, title]
    PlanningUpdate:
      allOf:
        - $ref: "#/components/schemas/PlanningFields"
    PlanningOrderInput:
      type: object
      required: [kind, ids]
      properties:
        kind:
          $ref: "#/components/schemas/PlanningKind"
        ids:
          type: array
          items:
            type: integer
            minimum: 1
    PlanningRecord:
      allOf:
        - $ref: "#/components/schemas/PlanningFields"
        - type: object
          required: [id, documentId, position, createdAt, updatedAt, kind, title, content, role, motivations, traits, arc, category, timeLabel, chapterId, characterId, relatedCharacterId]
          properties:
            id:
              type: integer
            documentId:
              type: integer
            position:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

